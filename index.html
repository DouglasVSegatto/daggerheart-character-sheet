<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daggerheart — Choose Layout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;600;800&display=optional" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗡️</text></svg>">
    <style>
        body { background-color: #1a1714; color: #e8e0d4; font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .choice-card { background: linear-gradient(145deg, #221f1a, #1e1b16); border: 1px solid #3d362a; border-radius: 16px; padding: 32px; cursor: pointer; transition: all 0.2s; }
        .choice-card:hover { border-color: #d4a017; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        .choice-card.selected { border-color: #d4a017; box-shadow: 0 0 16px rgba(212,160,23,0.2); }
    </style>
</head>
<body>
    <div class="w-full max-w-2xl mx-auto px-4">
        <div class="text-center mb-10">
            <h1 class="font-[Cinzel] text-3xl font-black tracking-wide text-[#d4a017] mb-2">Daggerheart</h1>
            <p class="text-sm text-zinc-500">Choose your character sheet layout</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-8">
            <div class="choice-card" onclick="choose('classic')">
                <div class="text-center">
                    <div class="text-2xl mb-3">📜</div>
                    <h2 class="font-[Cinzel] text-lg font-bold text-[#f5efe6] mb-2">Classic</h2>
                    <p class="text-xs text-zinc-500 leading-relaxed">Single-column layout with collapsible sections. Optimized for mobile, scrollable on desktop.</p>
                </div>
            </div>
            <div class="choice-card" onclick="choose('modern')">
                <div class="text-center">
                    <div class="text-2xl mb-3">⚔️</div>
                    <h2 class="font-[Cinzel] text-lg font-bold text-[#f5efe6] mb-2">V2</h2>
                    <p class="text-xs text-zinc-500 leading-relaxed">Tabbed grid layout. Uses full screen width on desktop, stacks on mobile. Same data, new structure.</p>
                </div>
            </div>
        </div>

        <div class="text-center">
            <label class="inline-flex items-center gap-2 cursor-pointer text-xs text-zinc-600">
                <input type="checkbox" id="rememberChk" checked class="accent-[#d4a017]">
                <span>Remember my choice</span>
            </label>
        </div>
    </div>

    <script>
        // Auto-redirect if preference is saved
        const pref = localStorage.getItem('dh_layout');
        if (pref === 'classic') window.location.replace('classic.html');
        else if (pref === 'modern') window.location.replace('classicv2.html');

        function choose(layout) {
            if (document.getElementById('rememberChk').checked) {
                localStorage.setItem('dh_layout', layout);
            }
            window.location.href = layout === 'classic' ? 'classic.html' : 'classicv2.html';
        }
    </script>
    <script src="js/analytics.js"></script>
</body>
</html>
